# ============================================================================
# Smart Pet Care and Vaccination Tracker
# Supabase & Database Configuration Properties
# ============================================================================

# Database Mode: SUPABASE_JDBC (live Supabase PostgreSQL)
database.mode=SUPABASE_JDBC

# 1. Supabase Project REST API Configuration
supabase.url=https://YOUR_SUPABASE_PROJECT_ID.supabase.co
supabase.anon.key=YOUR_SUPABASE_ANON_KEY
supabase.service.role.key=YOUR_SUPABASE_SERVICE_ROLE_KEY

# 2. Supabase PostgreSQL Direct JDBC Configuration
supabase.jdbc.url=jdbc:postgresql://db.YOUR_SUPABASE_PROJECT_ID.supabase.co:5432/postgres?sslmode=require
supabase.jdbc.user=postgres
supabase.jdbc.password=YOUR_SUPABASE_DB_PASSWORD

# 3. Local In-Memory Fallback Settings (used if Supabase is unreachable)
local.jdbc.url=jdbc:h2:file:C:/Users/SHINY/pet/data/petcaredb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
local.jdbc.user=sa
local.jdbc.password=
